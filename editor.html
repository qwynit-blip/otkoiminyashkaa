<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор открыток</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="editor-container">
        <div class="editor-sidebar">
            <h2>🎨 Редактор открытки</h2>
            
            <div class="editor-tabs">
                <button class="tab-btn active" data-tab="text">📝 Текст</button>
                <button class="tab-btn" data-tab="button">🔘 Кнопка</button>
                <button class="tab-btn" data-tab="stickers">😊 Эмодзи</button>
                <button class="tab-btn" data-tab="photos">🖼️ Фото</button>
                <button class="tab-btn" data-tab="background">🎨 Фон</button>
            </div>
            
            <!-- Вкладка: Текст -->
            <div id="textTab" class="tab-content active">
                <h3>📝 Текст открытки</h3>
                <textarea id="cardText" rows="6" placeholder="Введи текст для открытки..." style="width:100%"></textarea>
                <div class="text-options">
                    <label><input type="checkbox" id="textCenter"> Центрировать текст</label>
                    <label><input type="checkbox" id="textBold"> Жирный текст</label>
                </div>
                <div class="form-group">
                    <label>Цвет текста:</label>
                    <input type="color" id="textColor" value="#333333">
                </div>
            </div>
            
            <!-- Вкладка: Кнопка -->
            <div id="buttonTab" class="tab-content">
                <h3>🔘 Настройки кнопки</h3>
                <div class="form-group">
                    <label>Текст на кнопке:</label>
                    <input type="text" id="buttonText" value="Открыть открытку">
                </div>
                <div class="form-group">
                    <label>Цвет фона кнопки:</label>
                    <input type="color" id="buttonBgColor" value="#ffa58a">
                </div>
                <div class="form-group">
                    <label>Цвет текста кнопки:</label>
                    <input type="color" id="buttonTextColor" value="#333333">
                </div>
                <div class="form-group">
                    <label>Стиль кнопки:</label>
                    <select id="buttonStyle">
                        <option value="rounded">Скруглённая</option>
                        <option value="square">Квадратная</option>
                        <option value="shadow">С тенью</option>
                        <option value="glow">Свечение</option>
                        <option value="border">С рамкой</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Размер кнопки: <span id="sizeValue">50</span>px</label>
                    <input type="range" id="buttonSize" min="30" max="80" value="50">
                </div>
                <div class="form-group">
                    <label>Фото на кнопку:</label>
                    <input type="file" id="buttonPhotoInput" accept="image/*">
                    <div id="buttonPhotoPreview" style="margin-top:10px"></div>
                </div>
            </div>
            
            <!-- Вкладка: Эмодзи -->
            <div id="stickersTab" class="tab-content">
                <h3>😊 Добавь эмодзи</h3>
                <p class="hint">Нажми на эмодзи, чтобы добавить (макс 30 штук)</p>
                <div class="stickers-grid" id="stickersGrid">
                    <!-- Эмодзи будут добавлены через JS -->
                </div>
                <div class="form-group">
                    <label>Свои эмодзи (введите любой текст/эмодзи):</label>
                    <input type="text" id="customSticker" placeholder="😊 ❤️ 🎉">
                    <button id="addCustomSticker" class="small-btn">+ Добавить эмодзи</button>
                </div>
                <h4>Выбранные эмодзи (<span id="stickerCount">0</span>/30):</h4>
                <div id="selectedStickers" class="selected-stickers"></div>
            </div>
            
            <!-- Вкладка: Фото -->
            <div id="photosTab" class="tab-content">
                <h3>🖼️ Добавь фото</h3>
                <div class="form-group">
                    <label>Загрузить своё фото:</label>
                    <input type="file" id="photoUpload" accept="image/*">
                </div>
                <h4>Добавленные фото:</h4>
                <div id="selectedPhotos" class="selected-photos"></div>
                <div class="form-group">
                    <label>Размер фото (px):</label>
                    <input type="range" id="photoSize" min="40" max="150" value="60">
                </div>
            </div>
            
            <!-- Вкладка: Фон -->
            <div id="backgroundTab" class="tab-content">
                <h3>🎨 Настройки фона</h3>
                <div class="form-group">
                    <label>Основной цвет фона:</label>
                    <input type="color" id="bgColor1" value="#faceb1">
                </div>
                <div class="form-group">
                    <label>Второй цвет фона (градиент):</label>
                    <input type="color" id="bgColor2" value="#ffa58a">
                </div>
                <div class="form-group">
                    <label>PNG паттерн (много маленьких картинок):</label>
                    <input type="file" id="patternUpload" accept="image/png">
                    <button id="clearPattern" class="small-btn" style="margin-top:5px; background:#ff4444">❌ Очистить паттерн</button>
                </div>
                <div class="form-group">
                    <label>Прозрачность паттерна:</label>
                    <input type="range" id="patternOpacity" min="0" max="100" value="30">
                </div>
                <div class="form-group">
                    <label>Размер паттерна (px):</label>
                    <input type="range" id="patternSize" min="20" max="100" value="50">
                </div>
            </div>
            
            <button id="saveCardBtn" class="save-btn">💾 Создать открытку</button>
        </div>
        
        <div class="live-preview" id="livePreview">
            <div class="live-card" id="liveCard">
                <div class="background-pattern" id="livePattern"></div>
                <div class="live-text" id="liveText">Твой текст будет здесь</div>
                <button id="liveButton" class="live-button">Открытка</button>
                <div class="live-stickers" id="liveStickers"></div>
                <div class="live-photos" id="livePhotos"></div>
            </div>
        </div>
    </div>
    
    <script src="editor.js"></script>
</body>
</html>
