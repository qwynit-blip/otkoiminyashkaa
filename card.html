<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытка</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-area" id="logoArea">
            <span class="logo-icon" id="logoIcon">💌</span>
            <h1 class="site-title" id="siteTitle">Otkoiminyashkaa</h1>
        </div>
        <button class="menu-btn" id="menuBtn">☰</button>
    </header>

    <div class="overlay" id="overlay"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-header"><h3>Меню</h3><button class="close-menu" id="closeMenu">✖</button></div>
        <div class="menu-content" id="menuContent"></div>
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card-wrapper" id="cardWrapper">
            <div class="card-header">
                <h1>💌 Открытка для тебя</h1>
                <p class="hint-text">✨ Нажми на кнопку, чтобы открыть ✨</p>
            </div>
            <div class="card-content">
                <div id="cardText" class="card-text hidden-text"></div>
                <button id="cardButton" class="card-btn"></button>
                <div id="stickersCanvas" class="stickers-canvas"></div>
                <div id="photosCanvas" class="photos-canvas"></div>
            </div>
            <div class="card-options">
                <button id="likeBtn" class="option-btn">❤️ Нравится</button>
                <button id="reportBtn" class="option-btn">🚩 Пожаловаться</button>
            </div>
            <div class="card-footer">
                <button id="createOwnBtn" class="footer-btn">🔨 Создать свою</button>
                <button id="shareCardBtn" class="footer-btn share-footer">📤 Поделиться</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script src="card.js"></script>
</body>
</html>
