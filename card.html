<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя открытка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container" id="cardContainer">
        <div class="card-wrapper" id="cardWrapper">
            <div class="card-header">
                <h1>💌 Открытка для тебя</h1>
                <p class="hint-text">✨ Нажми на кнопку, чтобы открыть послание ✨</p>
            </div>
            
            <div class="card-content" id="cardContent">
                <div id="cardText" class="card-text hidden-text"></div>
                <button id="cardButton" class="card-btn"></button>
                <div id="stickersCanvas" class="stickers-canvas"></div>
                <div id="photosCanvas" class="photos-canvas"></div>
            </div>
            
            <div class="card-footer">
                <button id="createOwnBtn" class="footer-btn">🔨 Создать свою открытку</button>
                <button id="shareCardBtn" class="footer-btn share-footer">📤 Поделиться</button>
            </div>
        </div>
    </div>
    
    <script src="card.js"></script>
</body>
</html>
